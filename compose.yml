services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3010:3000"
  
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5183:5173"
  
  iceserver:
    build: 
      context: ./iceserver
      dockerfile: Dockerfile
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "5349:5349"
      - "5349:5349/udp"
  
  database:
    image: postgres:13
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5442:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  
  redis: 
    image: redis:6
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    
volumes:
  postgres_data:
  redis_data: